# TQC Benchmark Experiment Matrix Configuration
# Kuznetsov et al. (ICML 2020) Reproduction Suite

default_platform: kaggle
max_concurrent_gpu_slots: 2

# Named Presets
presets:
  pilot:
    description: "HalfCheetah-v4 pilot run reproducing ICML 2020 TQC performance (GitHub Issue #7)"
    env_id: "HalfCheetah-v4"
    seed: 42
    total_timesteps: 1000000
    checkpoint_freq: 50000
    eval_freq: 5000
    eval_episodes: 10
    warmup_steps: 10000
    batch_size: 256
    buffer_capacity: 1000000
    device: "cuda"
    exp_name: "kaggle_halfcheetah_pilot_s42"

  smoke:
    description: "Local or remote pre-flight smoke verification dry run (100 steps)"
    env_id: "HalfCheetah-v4"
    seed: 42
    total_timesteps: 100
    checkpoint_freq: 50
    eval_freq: 50
    eval_episodes: 1
    warmup_steps: 20
    batch_size: 16
    buffer_capacity: 1000
    device: "cpu"
    exp_name: "kaggle_tqc_smoke_test"

  hopper_pilot:
    description: "Hopper-v4 single-seed pilot run (seed 42) reproducing ICML 2020 (GitHub Issue #13)"
    env_id: "Hopper-v4"
    seed: 42
    total_timesteps: 1000000
    checkpoint_freq: 50000
    eval_freq: 5000
    eval_episodes: 10
    warmup_steps: 10000
    batch_size: 256
    buffer_capacity: 1000000
    device: "cuda"
    drop_top: 5
    exp_name: "kaggle_hopper_pilot_s42"

  hopper_phase9:
    description: "Hopper-v4 Phase 9 distributed multi-seed benchmark suite across 5 seeds (GitHub Issue #13)"
    env_id: "Hopper-v4"
    seed: 42
    seeds: [42, 43, 44, 45, 46]
    total_timesteps: 1000000
    checkpoint_freq: 50000
    eval_freq: 5000
    eval_episodes: 10
    warmup_steps: 10000
    batch_size: 256
    buffer_capacity: 1000000
    device: "cuda"
    drop_top: 5
    exp_name: "kaggle_hopper_phase09"

  ant_pilot:
    description: "Ant-v4 single-seed pilot run (seed 42) reproducing ICML 2020 (GitHub Issue #17)"
    env_id: "Ant-v4"
    seed: 42
    total_timesteps: 1000000
    checkpoint_freq: 50000
    eval_freq: 5000
    eval_episodes: 10
    warmup_steps: 10000
    batch_size: 256
    buffer_capacity: 1000000
    device: "cuda"
    drop_top: 5
    exp_name: "kaggle_ant_pilot_s42"

  ant_phase11:
    description: "Ant-v4 Phase 11 distributed multi-seed benchmark suite across 5 seeds (GitHub Issue #17)"
    env_id: "Ant-v4"
    seed: 42
    seeds: [42, 43, 44, 45, 46]
    total_timesteps: 1000000
    checkpoint_freq: 50000
    eval_freq: 5000
    eval_episodes: 10
    warmup_steps: 10000
    batch_size: 256
    buffer_capacity: 1000000
    device: "cuda"
    drop_top: 5
    exp_name: "kaggle_ant_phase11"

  benchmark_suite:
    description: "Full MuJoCo continuous control benchmark suite across 5 seeds (GitHub Issue #4)"
    environments:
      - name: "HalfCheetah-v4"
        steps: 1000000
      - name: "Hopper-v4"
        steps: 1000000
      - name: "Walker2d-v4"
        steps: 1000000
      - name: "Ant-v4"
        steps: 1000000
      - name: "Humanoid-v4"
        steps: 3000000
    seeds: [42, 43, 44, 45, 46]
    checkpoint_freq: 50000
    eval_freq: 5000
    eval_episodes: 10
    warmup_steps: 10000
    batch_size: 256
    buffer_capacity: 1000000
    device: "cuda"
